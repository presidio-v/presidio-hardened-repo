[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "presidio-hardened-repo"
version = "0.1.0"
description = "Claude Code skill that hardens a GitHub repo to a high OpenSSF Scorecard score and the OpenSSF Best Practices badge."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "PRESIDIO Group" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-cov"]
fuzz = ["atheris"]

[tool.setuptools]
# This repo is a skill (scripts + templates), not an importable library. Declare
# no packages so an editable install provides metadata + dev/fuzz deps without
# setuptools trying to auto-discover the top-level templates/plan/playbook dirs.
packages = []
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Mirror the presidio family hardened rule set (see cii-badge-passing warnings_strict).
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]
# S101: asserts are the test idiom. S603/S607: we shell out to git/gh by design.
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Atheris mandates the exact entrypoint name `TestOneInput` (N802), and a harness
# that swallows the expected exception with try/except/pass (SIM105) is idiomatic.
"fuzz/*" = ["N802", "SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["scripts"]

[tool.coverage.report]
show_missing = true
