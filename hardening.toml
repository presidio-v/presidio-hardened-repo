# hardening.toml — the presidio-hardened-repo skill's OWN manifest.
#
# This repo is hardened BY ITSELF (dogfooding). Every other target repo gets its
# own copy of this file at its root; `scripts/render.py` reads it to fill the
# templates under `templates/`. Keep it human-editable and check it into the
# target repo — it is the render input, the re-run record, and the idempotency
# anchor all at once.

[project]
name = "presidio-hardened-repo"
org = "presidio-v"
package = "presidio_hardened_repo"
description = "Claude Code skill that hardens a GitHub repo to a high OpenSSF Scorecard score and the OpenSSF Best Practices badge."
language = "python"           # "python" selects templates/python/; "none" = core only
tier = "silver"               # target level: passing | silver | gold

[people]
maintainer = "vstantch"
reviewer = "ceoofcyber"       # external two-person-review gate (write collaborator + CODEOWNER)
security_contact = "security@presidio-group.eu"

[legal]
copyright_holder = "PRESIDIO Group"
license = "MIT"

[badge]
bestpractices_id = 0          # filled in after a human registers at bestpractices.dev
